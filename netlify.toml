[build]
command = "npm --prefix frontend ci && npm --prefix frontend run build"
publish = "frontend/dist"

[[redirects]]
from = "/api/*"
to = "https://flyl.onrender.com/api/:splat"
status = 200

[[redirects]]
from = "/uploads/*"
to = "https://flyl.onrender.com/uploads/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
